name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # Covers the "PR merger" case explicitly: a merged PR targeting main
  # produces both a push to main and a closed pull_request event. The
  # publish job below only runs when the PR was actually merged.
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: x86_64-linux
            os: ubuntu-22.04
            zig_target: x86_64-linux
            archive: zig-analyzer-x86_64-linux.tar.gz
          - name: aarch64-linux
            os: ubuntu-22.04
            zig_target: aarch64-linux
            archive: zig-analyzer-aarch64-linux.tar.gz
          # NOTE: macos-13 images are retired, which left this job stuck in
          # "queued" forever. macos-15-intel is the current Intel image;
          # the build still cross-compiles via -Dtarget so the host arch
          # does not matter.
          - name: x86_64-macos
            os: macos-15-intel
            zig_target: x86_64-macos
            archive: zig-analyzer-x86_64-macos.tar.gz
          - name: aarch64-macos
            os: macos-latest
            zig_target: aarch64-macos
            archive: zig-analyzer-aarch64-macos.tar.gz
          - name: x86_64-windows
            os: windows-latest
            zig_target: x86_64-windows
            archive: zig-analyzer-x86_64-windows.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build Binary
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target.zig_target }} --summary all

      - name: Package Binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p package
          cp zig-out/bin/zig_analyzer package/zig-analyzer
          tar -czvf ${{ matrix.target.archive }} -C package zig-analyzer

      - name: Package Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item zig-out/bin/zig_analyzer.exe package/zig-analyzer.exe
          Compress-Archive -Path package/* -DestinationPath ${{ matrix.target.archive }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.name }}
          path: ${{ matrix.target.archive }}
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: build-release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # Run on pushes to main, on version tags, on merged PRs, and on manual
    # dispatch. Skip when a PR is closed without merging. Fork PRs are
    # skipped here because their GITHUB_TOKEN is read-only; the companion
    # push to main after the merge still publishes the release.
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List Artifacts
        run: ls -lh dist/

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Move dev tag to current commit
        # softprops/action-gh-release reuses an existing tag as-is, so a
        # floating "dev" tag would keep pointing at its first commit forever.
        # Move it here so every main-branch push updates the dev release.
        if: github.ref_type != 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f dev ${{ github.sha }}
          git push origin -f refs/tags/dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Development Build' }}
          body: ${{ github.ref_type == 'tag' && '' || 'Automated development build from the latest main branch commit. Downloaded binaries may be unsigned.' }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_type != 'tag' }}
          make_latest: ${{ github.ref_type == 'tag' && 'true' || 'false' }}
          generate_release_notes: ${{ github.ref_type == 'tag' }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
