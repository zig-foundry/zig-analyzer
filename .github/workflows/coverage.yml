name: Code Coverage

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  coverage:
    if: github.repository_owner == 'zig-foundry'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install kcov
        run: |
          wget https://github.com/SimonKagstrom/kcov/releases/download/v42/kcov-amd64.tar.gz
          sudo tar xf kcov-amd64.tar.gz -C /

      - name: Run Tests with kcov
        run: |
          kcov --version
          zig build test -Dcoverage -Duse-llvm --summary all

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          directory: zig-out/coverage/kcov-merged
          # Tokenless uploads are rejected with "Token required - not valid
          # tokenless upload". Prefer OIDC (no secret needed once the Codecov
          # GitHub app is installed); fall back to CODECOV_TOKEN when set.
          use_oidc: true
          token: ${{ secrets.CODECOV_TOKEN }}
          # Don't block CI when Codecov is unreachable or not yet configured.
          # Upload problems still show as a warning in the step log.
          fail_ci_if_error: false
          verbose: true
